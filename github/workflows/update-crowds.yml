name: Update crowd data

on:
  schedule:
    - cron: "17 9 * * *"   # every day, about 4-5 AM Eastern
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch crowd predictions
        run: python scripts/update_crowds.py

      - name: Save changes
        run: |
          git config user.name "crowd-bot"
          git config user.email "crowd-bot@users.noreply.github.com"
          git add crowds.json
          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update crowd data"
            git push
          fi
